<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/global/UV_LOGO_2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbra Vault</title>
    <script>
      // IIFE to apply theme immediately and prevent screen flash
      ;(function () {
        try {
          var prefsString = localStorage.getItem('user_preferences')
          var prefs = prefsString ? JSON.parse(prefsString) : {}
          var scheme = prefs.theme

          if (!scheme || scheme === 'system') {
            scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }

          document.documentElement.setAttribute('data-scheme', scheme)
        } catch (e) {
          // Fallback if JSON parsing fails
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-scheme', isDark ? 'dark' : 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
