<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/global/UV_LOGO_2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umbra Vault</title>
    <script>
      // Applies the saved/system theme before paint, to avoid a flash of the wrong scheme.
      // Keep this logic mirrored with src/utils/theme-utils.js if you change the storage shape.
      ;(function () {
        var STORAGE_KEY = 'user_preferences'
        var DARK_QUERY = '(prefers-color-scheme: dark)'

        function getScheme() {
          try {
            var prefs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')
            if (prefs.theme === 'light' || prefs.theme === 'dark') return prefs.theme
          } catch (e) {
            console.error('[theme] bootstrap parse failed', e)
          }
          return window.matchMedia(DARK_QUERY).matches ? 'dark' : 'light'
        }

        document.documentElement.setAttribute('data-scheme', getScheme())
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
